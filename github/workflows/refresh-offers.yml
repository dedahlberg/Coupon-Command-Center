name: Refresh coupon offers
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh public offer index
        run: node scripts/refresh-offers.cjs
      - name: Commit changed offer data
        run: |
          if git diff --quiet -- live-offers.json; then
            echo "No offer changes."
            exit 0
          fi
          git config user.name "coupon-command-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live-offers.json
          git commit -m "Refresh live coupon offers"
          git push
