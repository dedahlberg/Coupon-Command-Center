name: Refresh coupon offers

on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-coupon-offers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh broader public savings index
        run: node scripts/refresh-offers.cjs

      - name: Commit refreshed offer data
        run: |
          if git diff --quiet -- live-offers.json; then
            echo "No offer changes."
            exit 0
          fi

          git config user.name "coupon-command-bot"
          git config user.email "actions@users.noreply.github.com"

          git add live-offers.json
          git commit -m "Refresh broader live savings index"

          # Rebase onto the latest main in case another commit landed
          # while this workflow was running.
          git pull --rebase origin main

          git push origin HEAD:main
